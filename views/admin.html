<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · Fiorella y David</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/img/mono-green.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--raspberry:#9E2149;--raspberry-deep:#7A1636;--forest:#2F4A32;--sage:#6F7D5C;--paper:#EAE5D7;--card:#FBF9F3;--line:#D5CDB9;--ink:#26331F;--warn:#8A5A00;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--serif:"Cormorant Garamond",Georgia,serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--ui)}
a{color:var(--raspberry)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--raspberry);outline-offset:2px}
[hidden]{display:none!important}
header.bar{background:var(--forest);color:#F4F0E6;display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
header.bar img{width:26px;filter:brightness(2.2)}
header.bar h1{font:600 22px var(--serif);margin:0;flex:1;letter-spacing:.02em}
header.bar .who{font-size:14px;opacity:.9}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--forest);background:var(--forest);color:#F4F0E6;border-radius:999px;padding:7px 15px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}
.btn.rasp{background:var(--raspberry);border-color:var(--raspberry)}
.btn.ghost{background:transparent;color:var(--forest)}
.btn.light{background:transparent;border-color:#F4F0E6;color:#F4F0E6}
.btn.small{padding:4px 11px;font-size:13px}
.btn.danger{background:transparent;border-color:var(--raspberry);color:var(--raspberry)}
.btn:disabled{opacity:.45;cursor:not-allowed}
nav.tabs{display:flex;gap:4px;padding:0 14px;background:#DED7C4;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{border:0;background:none;padding:12px 14px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;color:var(--forest)}
nav.tabs button[aria-selected="true"]{border-bottom-color:var(--raspberry);color:var(--raspberry)}
nav.tabs .count{background:var(--raspberry);color:#fff;border-radius:999px;font-size:12px;padding:1px 7px;margin-left:5px}
main{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
h2{font:600 26px var(--serif);margin:0 0 14px;color:var(--forest)}
h3{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--sage);margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-bottom:14px}
.big{font:600 40px/1 var(--serif);color:var(--raspberry)}
.muted{color:#5F6A55}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--sage);font-weight:700}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar input[type=search],.toolbar select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.toolbar .spacer{flex:1}
.chip{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;border:1px solid var(--line);background:#fff;white-space:nowrap}
.chip.day{background:#E7EEDF;border-color:#BFCBAF}
.chip.eve{background:#EFE3EC;border-color:#D3BCCB}
.chip.ok{background:#E2F0E1;border-color:#A9CBA6;color:#1F4D23}
.chip.no{background:#F6E3E7;border-color:#DDAAB6;color:var(--raspberry-deep)}
.chip.wait{background:#FBF1D9;border-color:#E3CE96;color:var(--warn)}
.names{font-weight:600}
.replies{font-size:13px;margin:4px 0 0;padding:0;list-style:none}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.msg{border-bottom:1px solid var(--line);padding:14px 0}
.msg:last-child{border-bottom:0}
.msg blockquote{margin:6px 0 0;white-space:pre-wrap;font:500 19px/1.45 var(--serif)}
label.f{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}
.f+input,.f+select,.f+textarea,.field{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
textarea{min-height:84px;resize:vertical}
.hint{font-size:13px;color:#5F6A55;margin:4px 0 0}
.error{color:var(--raspberry-deep);font-weight:600;min-height:1.4em;margin:10px 0 0}
.notice{background:#FBF1D9;border:1px solid #E3CE96;border-radius:8px;padding:10px 12px;margin:0 0 14px}
.login{max-width:400px;margin:8vh auto 0}
dialog{border:1px solid var(--line);border-radius:12px;padding:22px;width:min(520px,94vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(30,40,28,.45)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--forest);color:#fff;padding:9px 16px;border-radius:999px;font-weight:600;box-shadow:0 4px 18px rgba(0,0,0,.2);z-index:50}
@media (max-width:640px){.row2{grid-template-columns:1fr}th,td{padding:7px 8px}header.bar h1{font-size:18px}table{min-width:640px}}
</style>
</head>
<body>
<header class="bar">
  <img src="/img/mono-cream.png" alt="">
  <h1>Fiorella y David · Admin</h1>
  <span class="who" id="who"></span>
  <button class="btn light small" id="logout" hidden>Log out</button>
</header>
<nav class="tabs" id="tabs" role="tablist" hidden></nav>
<main id="main"><p class="muted">Loading…</p></main>
<dialog id="dlg"></dialog>
<div id="toast" role="status" hidden></div>
<script src="/admin/static/admin.js"></script>
</body>
</html>
