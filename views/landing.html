<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiorella y David · 30 August 2027</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/img/mono-green.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Italianno&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{--raspberry:#9E2149;--forest:#2F4A32;--sage:#7E8C6A;--paper:#EAE5D7;--line:#CFC6B1}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--forest);font-family:"Cormorant Garamond",Garamond,Georgia,serif;font-size:19px;line-height:1.55;text-align:center;padding:40px 22px}
main{max-width:520px}
img{width:64px;margin:0 auto 18px;display:block}
h1{font-family:"Pinyon Script","Snell Roundhand",cursive;font-weight:400;color:var(--raspberry);font-size:clamp(52px,13vw,84px);line-height:1;margin:0}
h1 span{display:block;font-family:"Italianno",cursive;color:var(--forest);font-size:.7em;line-height:.8;margin:2px 0 4px}
.date{letter-spacing:.24em;text-transform:uppercase;font-size:14px;font-weight:600;margin:22px 0 4px}
.place{font-style:italic;margin:0 0 30px}
.note{border-top:1px solid var(--line);padding-top:24px;margin:0 0 14px}
.es{color:var(--sage);font-style:italic}
</style>
</head>
<body>
<main>
  <img src="/img/mono-green.png" alt="F and D monogram">
  <h1>Fiorella<span>y</span>David</h1>
  <p class="date">Monday 30 August 2027</p>
  <p class="place">Coombe Lodge, Blagdon</p>
  <p class="note">To see your invitation and RSVP, please open the personal link we sent you on WhatsApp.</p>
  <p class="es">Para ver su invitación y confirmar su asistencia, abran el enlace personal que les enviamos por WhatsApp.</p>
</main>
</body>
</html>
